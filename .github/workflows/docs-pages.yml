name: Publish documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/docs-requirements.txt
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install -r doc/docs-requirements.txt
      - name: Build Sphinx site
        env:
          MARIO_DOCS_BASEURL: https://www.marioproject.com/en/latest/
        run: |
          python -m sphinx -b html -W --keep-going doc/source _site/en/latest
          python doc/scripts/check_documentation.py _site/en/latest
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=en/latest/">
            <title>MARIO documentation</title>
          </head>
          <body><a href="en/latest/">MARIO documentation</a></body>
          </html>
          HTML
          test -s _site/en/latest/index.html
          test -s _site/en/latest/_static/mario-nav.json
          test -s _site/en/latest/resources/data-explorer/compare.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
