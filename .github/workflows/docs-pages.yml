name: Publish documentation to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [Verify development documentation]
    types: [completed]
    branches: [codex/model-configurations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mario-docs-${{ github.ref == 'refs/heads/main' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - name: Read documentation sources
        id: sources
        working-directory: publisher
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          sources = json.loads(Path('doc/versions.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('dev=' + sources['dev']['ref'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref == 'refs/heads/main' && github.sha || 'main' }}
          path: source-latest
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sources.outputs.dev }}
          path: source-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publisher/doc/docs-requirements.txt
      - name: Install build dependencies
        working-directory: publisher
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install -r doc/docs-requirements.txt pytest
      - name: Check cross-site navigation
        working-directory: publisher
        run: |
          node --test tests/docs/test_external_links.cjs tests/docs/test_docs_versions.cjs tests/docs/test_theme.cjs
          python -m pytest tests/docs/test_versioned_packaging.py tests/docs/test_preview_redirects.py tests/docs/test_downloads.py -q
      - name: Build and verify all versions
        run: |
          python publisher/doc/scripts/build_versioned_docs.py \
            --latest-source source-latest --dev-source source-dev \
            --output _site
          test -s _site/en/latest/index.html
          test -s _site/en/dev/user_guide/inspection/to_cvxlab.html
          test -s _site/en/dev/user_guide/transformations/import_accounts.html
          test -s _site/en/model_gallery/index.html
          test -s _site/en/model_gallery/models/pv-hlca.html
          test -s _site/en/preview/user_guide/index.html
          test -s _site/en/latest/_static/mario-editorial.css
          test -s _site/en/dev/_static/mario-editorial.css
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
