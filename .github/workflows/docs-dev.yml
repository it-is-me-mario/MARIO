name: Verify development documentation

on:
  push:
    branches: [codex/model-configurations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/docs-requirements.txt
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install -r doc/docs-requirements.txt
      - name: Check version navigation
        run: node --test tests/docs/test_docs_versions.cjs tests/docs/test_external_links.cjs
      - name: Build and verify Dev
        env:
          MARIO_DOCS_CHANNEL: dev
          MARIO_DOCS_REVISION: ${{ github.sha }}
          MARIO_DOCS_SITE_ROOT: https://www.marioproject.com
          MARIO_DOCS_BASEURL: https://www.marioproject.com/en/dev/
        run: |
          python -m sphinx -b html -W --keep-going doc/source _site/en/dev
          python doc/scripts/check_documentation.py _site/en/dev
