<div class="mario-system" role="img" aria-label="Schematic workflow: an input-output or supply-use system connects production and final demand to economic and environmental impacts. The blocks are illustrative, not observations.">
  <div class="mario-system__caption"><span>The economy, connected</span><span class="mario-system__notation">IOT / SUT</span></div>
  <div class="mario-system__matrix" aria-hidden="true">
    <span class="mario-system__axis">Production</span><span class="mario-system__axis">Final demand</span>
    <div class="mario-system__transactions">{% for cell in range(36) %}<i></i>{% endfor %}</div>
    <div class="mario-system__demand">{% for cell in range(12) %}<i></i>{% endfor %}</div>
    <div class="mario-system__accounts">Value added &amp; environmental accounts</div>
    <div class="mario-system__direct"></div>
  </div>
  <div class="mario-system__flow"><span>One system</span><span aria-hidden="true">→</span><span>Different scenarios</span></div>
  <div class="mario-system__outputs"><span>Economy</span><span>Environment</span><span>Supply chains</span></div>
  <p class="mario-system__note">From interdependencies to impacts.</p>
</div>
